name: mkt-content
version: 0.1.0
description: "Content and SEO writer: blog posts, website copy, case studies, keyword maps, on-page and technical SEO."
hermes_requires: ">=0.23.0"
author: "Vibe AI Labs"
license: "Proprietary"

env_requires:
  - name: OPENROUTER_API_KEY
    description: "OpenRouter key for the model (and Perplexity research)"
    required: true
  - name: SERPAPI_KEY
    description: "SerpAPI key for live Google SERP data (optional; falls back to web_search)"
    required: false

distribution_owned:
  - SOUL.md
  - config.yaml
  - skills/content
  - skills/seo
